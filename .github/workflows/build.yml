name: Build

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Required permissions for generating attestations
    permissions:
      id-token: write
      contents: read
      attestations: write
      
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build Zygisk Module
        run: |
          chmod +x ./gradlew
          sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
          sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
          ./gradlew :module:assembleRelease

      # Generate the cryptographic attestation
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'out/magisk_module_release/**/*'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Subway-ImGui-Menu-Release
          path: out/*.zip
